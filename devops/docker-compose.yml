# CMU Mini-5 DevOps — Jenkins + SonarQube stack
# Created: 2026-06-20
# Network: petclinic-devops-net (bridge, external — created manually first)

services:
  jenkins:
    build: ./docker/jenkins
    container_name: petclinic-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - petclinic-devops-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  sonarqube-db:
    image: postgres:15-alpine
    container_name: petclinic-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - petclinic-devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: petclinic-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - petclinic-devops-net
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /api/system/status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"\\\"status\\\":\\\"UP\\\"\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: petclinic-zap
    restart: "no"
    # One-shot scanner — kept out of `docker compose up` via a profile so it is
    # only created when explicitly invoked by 06-run-zap-baseline.sh.
    profiles:
      - scan
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - petclinic-devops-net
    # Anonymous volume for ZAP's working directory so -r report output works.
    # The report is copied out with `docker cp` instead of a host bind mount,
    # which avoids Docker Desktop's File Sharing requirement on macOS.
    volumes:
      - /zap/wrk

  prometheus:
    image: prom/prometheus:latest
    container_name: petclinic-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    # Config is injected via `docker cp` in 02-start-stack.sh to avoid
    # Docker Desktop File Sharing requirements on macOS.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - petclinic-devops-net

  grafana:
    image: grafana/grafana:latest
    container_name: petclinic-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - petclinic-devops-net

networks:
  petclinic-devops-net:
    external: true
    name: petclinic-devops-net

volumes:
  jenkins_home:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  grafana_data:
